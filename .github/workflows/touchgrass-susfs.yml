name: TouchGrass KernelSU-Next SUSFS build

on:
  push:
    branches:
      - touchgrass-susfs-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libssl-dev patch python3 rsync unzip zip

      - name: Clone TouchGrass source at the verified commit
        run: |
          git clone --no-checkout https://github.com/micr0softstore/samsung_android_kernel_a52xq.git kernel
          cd kernel
          git fetch --depth=1 origin 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7
          git checkout --detach FETCH_HEAD
          git config user.name "TouchGrass SUSFS Builder"
          git config user.email "actions@users.noreply.github.com"
          git status --short

      - name: Import KernelSU-Next v3.2.0-legacy manual-hook tree
        run: |
          git init ksun-legacy-src
          cd ksun-legacy-src
          git remote add origin https://github.com/crdroidandroid/android_kernel_oneplus_sm8350.git
          git config core.sparseCheckout true
          printf 'drivers/kernelsu/\n' > .git/info/sparse-checkout
          git fetch --depth=1 origin b0e9f56d42a064443cdf4ace2187595eb04544e9
          git checkout --detach FETCH_HEAD
          cd ..

          mkdir -p kernel/KernelSU/kernel
          cp -a ksun-legacy-src/drivers/kernelsu/. kernel/KernelSU/kernel/
          rm -rf kernel/drivers/kernelsu
          ln -s ../KernelSU/kernel kernel/drivers/kernelsu

          grep -q 'obj-$(CONFIG_KSU).*kernelsu' kernel/drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> kernel/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' kernel/drivers/Kconfig || \
            printf '\nsource "drivers/kernelsu/Kconfig"\n' >> kernel/drivers/Kconfig

      - name: Import official SUSFS v1.5.5 kernel-4.19 files
        run: |
          git init susfs-src
          cd susfs-src
          git remote add origin https://github.com/Star-Seven/susfs4ksu.git
          git config core.sparseCheckout true
          printf 'kernel_patches/\n' > .git/info/sparse-checkout
          git fetch --depth=1 origin 9bab63cbaf41b51edc35cd585970adc3e6636cda
          git checkout --detach FETCH_HEAD
          cd ..

          cp susfs-src/kernel_patches/fs/*.c kernel/fs/
          cp susfs-src/kernel_patches/include/linux/*.h kernel/include/linux/

      - name: Apply SUSFS patches and preserve manual hooks
        shell: bash
        run: |
          set +e

          cd kernel/KernelSU
          patch --batch --forward -p1 < ../../susfs-src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            > ../../ksu_susfs_patch.log 2>&1
          echo $? > ../../ksu_susfs_patch.status
          cd ../..

          cd kernel
          patch --batch --forward -p1 < ../susfs-src/kernel_patches/50_add_susfs_in_kernel-4.19.patch \
            > ../kernel_susfs_patch.log 2>&1
          echo $? > ../kernel_susfs_patch.status
          cd ..

          python3 <<'PY'
          from pathlib import Path

          reboot = Path('kernel/kernel/reboot.c')
          text = reboot.read_text()
          if 'ksu_handle_sys_reboot' not in text:
              marker = 'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,'
              declaration = '''#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\n'''
              text = text.replace(marker, declaration + marker, 1)
              body_marker = '\tchar buffer[256];\n\tint ret = 0;\n'
              hook = '''\tchar buffer[256];\n\tint ret = 0;\n\n#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n'''
              if body_marker not in text:
                  raise SystemExit('Could not locate reboot syscall body')
              text = text.replace(body_marker, hook, 1)
              reboot.write_text(text)

          cfg = Path('kernel/arch/arm64/configs/a52xq_defconfig')
          lines = cfg.read_text().splitlines()
          remove_prefixes = (
              'CONFIG_KSU=', 'CONFIG_KSU_MANUAL_HOOK=', 'CONFIG_KSU_KPROBES_HOOK=',
              'CONFIG_KSU_SUSFS=', 'CONFIG_KSU_SUSFS_',
          )
          lines = [line for line in lines if not line.startswith(remove_prefixes)]
          lines += [
              'CONFIG_KSU=y',
              'CONFIG_KSU_MANUAL_HOOK=y',
              '# CONFIG_KSU_KPROBES_HOOK is not set',
              'CONFIG_KSU_SUSFS=y',
              'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y',
              'CONFIG_KSU_SUSFS_SUS_PATH=y',
              'CONFIG_KSU_SUSFS_SUS_MOUNT=y',
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y',
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y',
              'CONFIG_KSU_SUSFS_SUS_KSTAT=y',
              '# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set',
              'CONFIG_KSU_SUSFS_TRY_UMOUNT=y',
              'CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y',
              'CONFIG_KSU_SUSFS_SPOOF_UNAME=y',
              '# CONFIG_KSU_SUSFS_ENABLE_LOG is not set',
              'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y',
              'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y',
              'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y',
              '# CONFIG_KSU_SUSFS_SUS_SU is not set',
          ]
          cfg.write_text('\n'.join(lines) + '\n')
          PY

          find kernel -name '*.rej' -o -name '*.orig' | sort > patch_reject_files.txt
          cat ksu_susfs_patch.log
          cat kernel_susfs_patch.log
          echo "KSU patch status: $(cat ksu_susfs_patch.status)"
          echo "Kernel patch status: $(cat kernel_susfs_patch.status)"
          cat patch_reject_files.txt

      - name: Build kernel and capture complete log
        shell: bash
        run: |
          set +e
          cd kernel
          rm -rf out
          chmod +x build_kernel.sh tools/dtc 2>/dev/null || true
          bash build_kernel.sh 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../build.status
          exit 0

      - name: Create diagnostic patch and report
        if: always()
        shell: bash
        run: |
          cd kernel
          git add -N . 2>/dev/null || true
          git diff --binary -- . ':!toolchain' ':!out' > ../touchgrass-ksunext-susfs.patch
          cd ..
          {
            echo "Kernel base: 6bf351bdf18bdb228db79e66f14a7a9c0178e5d7"
            echo "KernelSU-Next source: crDroid b0e9f56d42a064443cdf4ace2187595eb04544e9"
            echo "SUSFS source mirror: 9bab63cbaf41b51edc35cd585970adc3e6636cda"
            echo "KSU patch status: $(cat ksu_susfs_patch.status 2>/dev/null || echo missing)"
            echo "Kernel patch status: $(cat kernel_susfs_patch.status 2>/dev/null || echo missing)"
            echo "Build status: $(cat build.status 2>/dev/null || echo missing)"
            echo
            echo "Rejects:"
            cat patch_reject_files.txt 2>/dev/null || true
          } > integration-report.txt
          tail -n 300 build.log > build-tail.log 2>/dev/null || true
          find kernel -name '*.rej' -o -name '*.orig' | while read -r f; do
            mkdir -p "rejects/$(dirname "$f")"
            cp "$f" "rejects/$f"
          done

      - name: Upload diagnostic and kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchgrass-susfs-build-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            integration-report.txt
            ksu_susfs_patch.log
            kernel_susfs_patch.log
            patch_reject_files.txt
            build.status
            build.log
            build-tail.log
            touchgrass-ksunext-susfs.patch
            rejects/
            kernel/out/.config
            kernel/out/arch/arm64/boot/Image
